services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conduct
      POSTGRES_PASSWORD: conduct
      POSTGRES_DB: conduct
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduct -d conduct"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: conduct
      POSTGRES_PASSWORD: conduct
      POSTGRES_DB: conduct_test
    ports:
      # 5435 avoids clashing with a local Postgres often bound to 5433 on developer machines.
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U conduct -d conduct_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+psycopg://conduct:conduct@postgres:5432/conduct
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  postgres_data:
